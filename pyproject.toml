[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-manager"
version = "1.0.0"
description = "Antigravity Multi-Account Manager - Run multiple Google accounts simultaneously with zero collisions."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Arun Roshan", email = "arunroshan1003@gmail.com" }
]
keywords = ["antigravity", "cli", "multi-account", "gemini", "ai", "developer-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
agm = "agm.cli:main"
agy-multi = "agm.cli:main"

[project.urls]
Homepage = "https://github.com/roshzxn1003/antigravity-multi-account"
Repository = "https://github.com/roshzxn1003/antigravity-multi-account.git"
Issues = "https://github.com/roshzxn1003/antigravity-multi-account/issues"

